name: Cypress Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  cypress-run:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dos testes
        uses: actions/checkout@v7

      - name: Checkout da aplicação Hub de Leitura
        uses: actions/checkout@v7
        with:
          repository: EBAC-QE/hub-de-leitura-integrado
          path: hub-de-leitura-integrado

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hub-de-leitura-integrado/package-lock.json

      - name: Instalar dependências da aplicação
        working-directory: hub-de-leitura-integrado
        run: npm ci

      - name: Iniciar a aplicação em segundo plano
        working-directory: hub-de-leitura-integrado
        run: npm start &

      - name: Instalar dependências dos testes
        run: npm ci

      - name: Aguardar a aplicação responder
        run: npx --yes wait-on http://localhost:3000 --timeout 60000

      - name: Executar testes Cypress
        run: npm run cy:run

      - name: Upload de screenshots em caso de falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
